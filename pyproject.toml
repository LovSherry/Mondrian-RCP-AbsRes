[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soil-mondrian-rcp"
version = "0.2.1"
description = "Group-calibrated, sample-adaptive prediction intervals for soil spectroscopy"
authors = [{name = "Xuepeng Li"}]
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {file = "LICENSE"}
keywords = ["soil spectroscopy", "conformal prediction", "rectified conformal prediction", "Mondrian calibration", "SOC"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy==1.26.4",
  "pandas==2.3.3",
  "pyarrow==21.0.0",
  "scipy==1.13.1",
  "scikit-learn==1.6.1",
  "joblib==1.4.2",
  "threadpoolctl==3.6.0",
  "tomli>=2.0; python_version < '3.11'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]
